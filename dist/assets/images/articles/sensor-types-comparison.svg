<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Segoe Print', cursive">
  <defs>
    <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="19"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </defs>
  <rect width="900" height="600" fill="#faf6ec"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" fill="#3a3a3a">Four ways to sense a part</text>

  <!-- Inductive -->
  <g filter="url(#sketchy)">
    <rect x="50" y="70" width="380" height="220" rx="10" fill="#a8d5c8" stroke="#3a3a3a" stroke-width="2.2"/>
    <circle cx="130" cy="180" r="34" fill="none" stroke="#3a3a3a" stroke-width="2.5"/>
    <path d="M105 180 h50 M130 155 v50" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="230" y="160" width="60" height="40" fill="#3a3a3a" opacity="0.6"/>
  </g>
  <text x="240" y="100" text-anchor="middle" font-size="16" fill="#3a3a3a">Inductive</text>
  <text x="240" y="240" text-anchor="middle" font-size="12" fill="#3a3a3a">senses metal only,</text>
  <text x="240" y="258" text-anchor="middle" font-size="12" fill="#3a3a3a">no contact, short range</text>

  <!-- Capacitive -->
  <g filter="url(#sketchy)">
    <rect x="470" y="70" width="380" height="220" rx="10" fill="#f0dca0" stroke="#3a3a3a" stroke-width="2.2"/>
    <circle cx="550" cy="180" r="34" fill="none" stroke="#3a3a3a" stroke-width="2.5"/>
    <path d="M525 180 h50 M550 155 v50" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="650" y="150" width="60" height="60" fill="#8ab4d8" opacity="0.7"/>
  </g>
  <text x="660" y="100" text-anchor="middle" font-size="16" fill="#3a3a3a">Capacitive</text>
  <text x="660" y="240" text-anchor="middle" font-size="12" fill="#3a3a3a">senses any material,</text>
  <text x="660" y="258" text-anchor="middle" font-size="12" fill="#3a3a3a">even through a wall</text>

  <!-- Photoelectric -->
  <g filter="url(#sketchy)">
    <rect x="50" y="330" width="380" height="220" rx="10" fill="#f2b8a8" stroke="#3a3a3a" stroke-width="2.2"/>
    <rect x="90" y="420" width="30" height="20" fill="#3a3a3a"/>
    <rect x="330" y="420" width="30" height="20" fill="#3a3a3a"/>
    <path d="M120 430 h210" stroke="#e8a860" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="220" y="405" width="30" height="50" fill="#3a3a3a" opacity="0.6"/>
  </g>
  <text x="240" y="360" text-anchor="middle" font-size="16" fill="#3a3a3a">Photoelectric</text>
  <text x="240" y="500" text-anchor="middle" font-size="12" fill="#3a3a3a">light beam interrupted,</text>
  <text x="240" y="518" text-anchor="middle" font-size="12" fill="#3a3a3a">long range, any object</text>

  <!-- Encoder -->
  <g filter="url(#sketchy)">
    <rect x="470" y="330" width="380" height="220" rx="10" fill="#d0b8e8" stroke="#3a3a3a" stroke-width="2.2"/>
    <circle cx="660" cy="440" r="55" fill="none" stroke="#3a3a3a" stroke-width="2.5"/>
    <line x1="660" y1="440" x2="660" y2="390" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="660" y1="440" x2="700" y2="440" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="660" cy="440" r="5" fill="#3a3a3a"/>
  </g>
  <text x="660" y="360" text-anchor="middle" font-size="16" fill="#3a3a3a">Encoder</text>
  <text x="660" y="500" text-anchor="middle" font-size="12" fill="#3a3a3a">measures rotation,</text>
  <text x="660" y="518" text-anchor="middle" font-size="12" fill="#3a3a3a">position or speed</text>

  <text x="450" y="585" text-anchor="middle" font-size="14" fill="#3a3a3a">Presence sensors answer "is it there?" — encoders answer "how much, or how fast?"</text>
</svg>
