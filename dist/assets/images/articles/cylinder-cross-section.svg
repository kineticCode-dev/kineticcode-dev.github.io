<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Segoe Print', cursive">
  <defs>
    <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="53"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </defs>
  <rect width="900" height="460" fill="#faf6ec"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" fill="#3a3a3a">Double-acting cylinder, cross-section</text>

  <g filter="url(#sketchy)">
    <rect x="120" y="150" width="500" height="120" rx="8" fill="#faf6ec" stroke="#3a3a3a" stroke-width="2.5"/>
    <rect x="130" y="160" width="230" height="100" fill="#a8d5c8" opacity="0.7" stroke="#3a3a3a" stroke-width="1.6"/>
    <rect x="360" y="200" width="20" height="20" fill="#3a3a3a"/>
    <rect x="380" y="185" width="20" height="50" fill="#3a3a3a"/>
    <line x1="600" y1="210" x2="760" y2="210" stroke="#3a3a3a" stroke-width="10"/>
  </g>
  <text x="245" y="215" text-anchor="middle" font-size="13" fill="#3a3a3a">port A (extend)</text>
  <text x="600" y="140" text-anchor="middle" font-size="13" fill="#3a3a3a">port B (retract)</text>
  <text x="700" y="245" text-anchor="middle" font-size="13" fill="#3a3a3a">rod</text>

  <!-- sensors on the tie rods -->
  <g filter="url(#sketchy)">
    <rect x="140" y="140" width="26" height="16" fill="#f0dca0" stroke="#3a3a3a" stroke-width="1.6"/>
    <rect x="330" y="140" width="26" height="16" fill="#f0dca0" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="153" y="128" text-anchor="middle" font-size="11" fill="#3a3a3a">retracted</text>
  <text x="153" y="115" text-anchor="middle" font-size="11" fill="#3a3a3a">sensor</text>
  <text x="343" y="128" text-anchor="middle" font-size="11" fill="#3a3a3a">extended</text>
  <text x="343" y="115" text-anchor="middle" font-size="11" fill="#3a3a3a">sensor</text>

  <g filter="url(#sketchy)" stroke="#3a3a3a" stroke-width="1.4" fill="none">
    <line x1="153" y1="156" x2="153" y2="180"/>
    <line x1="343" y1="156" x2="343" y2="180"/>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="14" fill="#3a3a3a">Magnetic reed or hall-effect sensors clamp on the tie rods —</text>
  <text x="450" y="352" text-anchor="middle" font-size="14" fill="#3a3a3a">the piston has a built-in ring magnet, no wiring inside the cylinder needed.</text>

  <text x="450" y="410" text-anchor="middle" font-size="14" fill="#3a3a3a">Air pushed into port A extends the rod; air into port B retracts it.</text>
</svg>
