<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Segoe Print', cursive">
  <defs>
    <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5"/>
    </filter>
  </defs>
  <rect width="900" height="620" fill="#faf6ec"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" fill="#3a3a3a">Inside the electrical cabinet</text>

  <g filter="url(#sketchy)" stroke="#3a3a3a" stroke-width="2.5" fill="none">
    <rect x="60" y="70" width="780" height="500" rx="8"/>
  </g>

  <!-- Main breaker -->
  <g filter="url(#sketchy)">
    <rect x="90" y="100" width="150" height="90" rx="6" fill="#f2b8a8" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="165" y="140" text-anchor="middle" font-size="14" fill="#3a3a3a">Main circuit</text>
  <text x="165" y="158" text-anchor="middle" font-size="14" fill="#3a3a3a">breaker</text>

  <!-- Power supply 24VDC -->
  <g filter="url(#sketchy)">
    <rect x="270" y="100" width="150" height="90" rx="6" fill="#f0dca0" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="345" y="140" text-anchor="middle" font-size="14" fill="#3a3a3a">24VDC power</text>
  <text x="345" y="158" text-anchor="middle" font-size="14" fill="#3a3a3a">supply</text>

  <!-- PLC -->
  <g filter="url(#sketchy)">
    <rect x="450" y="100" width="150" height="90" rx="6" fill="#a8c5e8" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="525" y="140" text-anchor="middle" font-size="14" fill="#3a3a3a">PLC CPU</text>
  <text x="525" y="158" text-anchor="middle" font-size="14" fill="#3a3a3a">+ I/O modules</text>

  <!-- Safety relay -->
  <g filter="url(#sketchy)">
    <rect x="630" y="100" width="150" height="90" rx="6" fill="#d0b8e8" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="705" y="140" text-anchor="middle" font-size="14" fill="#3a3a3a">Safety relay</text>
  <text x="705" y="158" text-anchor="middle" font-size="14" fill="#3a3a3a">module</text>

  <!-- Contactors -->
  <g filter="url(#sketchy)">
    <rect x="90" y="260" width="150" height="90" rx="6" fill="#a8d5c8" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="165" y="300" text-anchor="middle" font-size="14" fill="#3a3a3a">Motor</text>
  <text x="165" y="318" text-anchor="middle" font-size="14" fill="#3a3a3a">contactors</text>

  <!-- Relays -->
  <g filter="url(#sketchy)">
    <rect x="270" y="260" width="150" height="90" rx="6" fill="#a8d5c8" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="345" y="300" text-anchor="middle" font-size="14" fill="#3a3a3a">Interface</text>
  <text x="345" y="318" text-anchor="middle" font-size="14" fill="#3a3a3a">relays</text>

  <!-- Circuit breakers small -->
  <g filter="url(#sketchy)">
    <rect x="450" y="260" width="150" height="90" rx="6" fill="#f2b8a8" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="525" y="300" text-anchor="middle" font-size="14" fill="#3a3a3a">Branch</text>
  <text x="525" y="318" text-anchor="middle" font-size="14" fill="#3a3a3a">breakers</text>

  <!-- Terminal blocks -->
  <g filter="url(#sketchy)">
    <rect x="630" y="260" width="150" height="90" rx="6" fill="#f0dca0" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <text x="705" y="300" text-anchor="middle" font-size="14" fill="#3a3a3a">Terminal</text>
  <text x="705" y="318" text-anchor="middle" font-size="14" fill="#3a3a3a">blocks (field)</text>

  <!-- cable duct -->
  <g filter="url(#sketchy)" stroke="#3a3a3a" stroke-width="1.6" fill="none">
    <path d="M100 400 h680" stroke-dasharray="6 6"/>
  </g>
  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#3a3a3a">cable ducts run horizontally, field wiring exits at the bottom</text>

  <g filter="url(#sketchy)">
    <rect x="90" y="440" width="690" height="100" rx="6" fill="#faf6ec" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <text x="435" y="475" text-anchor="middle" font-size="14" fill="#3a3a3a">Field devices: motors, valves, sensors</text>
  <text x="435" y="500" text-anchor="middle" font-size="14" fill="#3a3a3a">(outside the cabinet, on the machine itself)</text>
  <text x="435" y="522" text-anchor="middle" font-size="13" fill="#666">everything above connects down here through cables and glands</text>
</svg>
