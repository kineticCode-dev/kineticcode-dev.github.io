name: Translate new articles

# Runs whenever you push a new/changed Italian article, and calls the
# Claude API to generate the missing EN/ES/FR/DE versions. It never
# publishes them directly: it opens a Pull Request so you can read the
# translations and approve before they go live (in line with the
# Manifesto: every release gets a human sign-off).
#
# You can also run it manually from the Actions tab (workflow_dispatch)
# to backfill translations for older articles, or with "force" checked
# to regenerate existing translations.
on:
  push:
    branches: [main]
    paths:
      - "content/articles/it/**.md"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate translations even if the file already exists"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run translation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run translate -- --force
          else
            npm run translate
          fi

      - name: Open pull request with new translations
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add automated translations"
          title: "New article translations (review before merging)"
          body: |
            Generated automatically by Claude (${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}) from the Italian source article(s).

            Please read through each translated file before merging — once merged into `main`, the site rebuilds and these go live. If a translation needs a tweak, edit it directly in this PR's branch (or ask Claude to revise it) before approving.
          branch: auto-translations
          add-paths: content/articles/**.md
          delete-branch: true
